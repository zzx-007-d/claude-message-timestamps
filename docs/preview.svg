<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Message timestamps preview</title>
  <desc id="desc">Illustration of a Claude Code chat. Your message shows its time 23:21 on hover, next to the app's own "Just now" label. Claude's answer shows its time 23:22 at its bottom right.</desc>
  <style>
    .bg { fill: #1b1b1a; }
    .bubble { fill: #2e2e2c; }
    .text { fill: #e8e6e1; font: 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .muted { fill: #8e8c86; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .stamp { fill: #8e8c86; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .stamp-reply { fill: #8e8c86; font: 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .icon { fill: none; stroke: #8e8c86; stroke-width: 1.4; }
    .note { fill: #5b9cf5; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .arrow { fill: none; stroke: #5b9cf5; stroke-width: 1.5; }
    .hilite { fill: none; stroke: #5b9cf5; stroke-width: 1.5; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b9cf5"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="360" rx="12"/>

  <!-- Your message -->
  <rect class="bubble" x="402" y="28" width="318" height="44" rx="12"/>
  <text class="text" x="420" y="55">Summarize this file in three bullet points</text>

  <!-- Hover row under your message: our time, then the app's own label and buttons -->
  <rect class="hilite" x="504" y="82" width="46" height="22" rx="5"/>
  <text class="stamp" x="512" y="97">23:21</text>
  <text class="muted" x="560" y="97">✓ Just now</text>
  <text class="muted" x="628" y="97">·</text>
  <rect class="icon" x="640" y="87" width="10" height="10" rx="2"/>
  <path class="icon" d="M670 92 a5 5 0 1 0 -1.5 3.6 M670 87 v5 h-5"/>
  <path class="icon" d="M690 87 l8 0 m0 0 l0 8 m0 -8 l-9 9"/>

  <!-- Callout for the hover time -->
  <path class="arrow" d="M452 128 C470 128 500 120 520 107" marker-end="url(#head)"/>
  <text class="note" x="236" y="133">Your message: its time on hover</text>

  <!-- Claude's answer -->
  <text class="text" x="40" y="182">Here is a short summary of the file:</text>
  <text class="text" x="56" y="212">• It loads the settings and checks them for errors</text>
  <text class="text" x="56" y="238">• It reads the saved data and sorts it by date</text>
  <text class="text" x="56" y="264">• It writes a report and prints where it was saved</text>
  <rect class="hilite" x="672" y="248" width="52" height="24" rx="5"/>
  <text class="stamp-reply" x="680" y="265">23:22</text>

  <!-- The app's own buttons under Claude's answer: copy, pin, speaker, "Just now" -->
  <rect class="icon" x="40" y="290" width="10" height="10" rx="2"/>
  <path class="icon" d="M66 289 l4 4 l-3 3 l-4 -4 z M64 297 l-3 4"/>
  <path class="icon" d="M84 292 h3 l4 -3 v12 l-4 -3 h-3 z M95 292 a4 4 0 0 1 0 6"/>
  <text class="muted" x="110" y="300">Just now</text>

  <!-- Callout for the reply time -->
  <path class="arrow" d="M600 316 C640 316 680 300 695 276" marker-end="url(#head)"/>
  <text class="note" x="352" y="321">Claude's answer: when it finished</text>
</svg>
